[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-names"
version = "0.1.0"
description = "MCP server for German surname hydration via Namelex"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
dependencies = [
  "mcp>=1.12,<2",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
fast = ["rapidfuzz>=3.0"]

[project.scripts]
mcp-names = "mcp_names.__main__:main"
namelex = "namelex.cli:main"

[tool.setuptools.packages.find]
where = ["src", "packages/namelex/src"]

[tool.setuptools.package-data]
namelex = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/namelex/tests"]
pythonpath = ["src", "packages/namelex/src"]
