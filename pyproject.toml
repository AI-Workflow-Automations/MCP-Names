[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "namelex"
version = "0.1.0"
description = "German surname lexicon for fuzzy name resolution (hydration backend for mcp-names)"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
fast = ["rapidfuzz>=3.0"]
dev = ["pytest>=7"]

[project.scripts]
namelex = "namelex.cli:main"

[tool.setuptools.packages.find]
where = ["packages/namelex/src"]

[tool.setuptools.package-data]
namelex = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["packages/namelex/tests"]
pythonpath = ["packages/namelex/src"]
