name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Fixture DB
        run: |
          if [ ! -f data/fixtures/surnames.sqlite3 ]; then
            python scripts/build_fixture_db.py
          fi
      - name: Test
        run: pytest -q
